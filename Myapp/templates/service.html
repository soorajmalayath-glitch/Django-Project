<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Service Request</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00c6fb,#43e97b);
            padding:30px;
        }

        .container{
            width:100%;
            max-width:650px;
            background:#fff;
            border-radius:20px;
            padding:40px;
            box-shadow:0 20px 40px rgba(0,0,0,.2);
            animation:fadeIn .8s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        h2{
            text-align:center;
            margin-bottom:10px;
            color:#222;
            font-size:32px;
        }

        .subtitle{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        form p{
            margin-bottom:18px;
        }

        form label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#444;
        }

        form input,
        form select,
        form textarea{
            width:100%;
            padding:14px;
            border:1px solid #dcdcdc;
            border-radius:10px;
            outline:none;
            font-size:15px;
            transition:.3s;
        }

        form textarea{
            resize:vertical;
            min-height:120px;
        }

        form input:focus,
        form select:focus,
        form textarea:focus{
            border-color:#2196f3;
            box-shadow:0 0 12px rgba(33,150,243,.3);
        }

        button{
            width:100%;
            padding:15px;
            background:linear-gradient(135deg,#2196f3,#00bcd4);
            border:none;
            border-radius:10px;
            color:white;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(33,150,243,.4);
        }

        button:active{
            transform:scale(.98);
        }

        .message{
            margin-top:20px;
            padding:15px;
            background:#d4edda;
            color:#155724;
            border-left:6px solid #28a745;
            border-radius:8px;
            font-weight:bold;
        }

        @media(max-width:768px){

            .container{
                padding:25px;
            }

            h2{
                font-size:26px;
            }

        }

    </style>
</head>
<body>

<div class="container">

    <h2>🏠 Home Service Request</h2>
    <p class="subtitle">
        Fill out the form below and our professionals will contact you shortly.
    </p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ x.as_p }}

        <button type="submit">
            🚀 Submit Request
        </button>

    </form>

    {% for message in messages %}
        <div class="message">
            ✅ {{ message }}
        </div>
    {% endfor %}

</div>

</body>
</html>
