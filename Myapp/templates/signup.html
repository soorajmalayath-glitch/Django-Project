<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00c6fb,#43e97b);
            padding:30px;
        }

        .register-container{
            width:100%;
            max-width:550px;
            background:#fff;
            padding:40px;
            border-radius:20px;
            box-shadow:0 20px 40px rgba(0,0,0,.2);
            animation:fadeIn .8s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        h2{
            text-align:center;
            color:#333;
            margin-bottom:10px;
            font-size:32px;
        }

        .subtitle{
            text-align:center;
            color:#777;
            margin-bottom:30px;
        }

        form p{
            margin-bottom:18px;
        }

        form label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#444;
        }

        form input,
        form select,
        form textarea{
            width:100%;
            padding:14px;
            border:1px solid #d8d8d8;
            border-radius:10px;
            font-size:15px;
            outline:none;
            transition:.3s;
        }

        form input:focus,
        form select:focus,
        form textarea:focus{
            border-color:#2196f3;
            box-shadow:0 0 10px rgba(33,150,243,.3);
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#2196f3,#00bcd4);
            color:#fff;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
            margin-top:10px;
        }

        button:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(33,150,243,.4);
        }

        button:active{
            transform:scale(.98);
        }

        .login-link{
            text-align:center;
            margin-top:25px;
        }

        .login-link a{
            text-decoration:none;
            color:#2196f3;
            font-weight:600;
            transition:.3s;
        }

        .login-link a:hover{
            color:#0b7dda;
            text-decoration:underline;
        }

        .message{
            margin-top:20px;
            background:#d4edda;
            color:#155724;
            padding:12px;
            border-left:5px solid #28a745;
            border-radius:8px;
            font-weight:bold;
        }

        @media(max-width:600px){

            .register-container{
                padding:25px;
            }

            h2{
                font-size:26px;
            }

        }

    </style>

</head>
<body>

<div class="register-container">

    <h2> Create Account</h2>
    <p class="subtitle">
        Register to book trusted home services quickly and easily.
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
             Register
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="{% url 'login_page' %}">
            Login Here
        </a>
    </div>

    {% for message in messages %}
        <div class="message">
            ✅ {{ message }}
        </div>
    {% endfor %}

</div>

</body>
</html>
